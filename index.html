<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>HACKER//OS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/effects.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/windows.css" />
  <link rel="stylesheet" href="styles/apps.css" />
  <link rel="stylesheet" href="styles/login.css" />
</head>
<body>

  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-terminal" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="15" rx="3" />
      <path d="M7 9l3 3-3 3" />
      <path d="M12.5 15H17" />
    </symbol>
    <symbol id="icon-files" viewBox="0 0 24 24">
      <path d="M3 7a2 2 0 0 1 2-2h4.2l2 2.2H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    </symbol>
    <symbol id="icon-editor" viewBox="0 0 24 24">
      <path d="M6 3h7.5L18 7.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
      <path d="M13.5 3v5H18" />
      <path d="M8 12.5h8M8 16h8" />
    </symbol>
    <symbol id="icon-network" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2.4" />
      <circle cx="5.5" cy="18" r="2.4" />
      <circle cx="18.5" cy="18" r="2.4" />
      <path d="M10.9 7.2 6.6 15.7M13.1 7.2l4.3 8.5M7.9 18h8.2" />
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M4 7.5h9M17.5 7.5H20M4 16.5h3M11.5 16.5H20" />
      <circle cx="15.5" cy="7.5" r="2.2" />
      <circle cx="9.5" cy="16.5" r="2.2" />
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 11v5" />
      <path d="M12 8h.01" />
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="4" y="4" width="7" height="7" rx="1.5" />
      <rect x="13" y="4" width="7" height="7" rx="1.5" />
      <rect x="4" y="13" width="7" height="7" rx="1.5" />
      <rect x="13" y="13" width="7" height="7" rx="1.5" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-3.6-3.6" />
    </symbol>
  </svg>

  <div class="grain" aria-hidden="true"></div>

  <div id="login" class="login" aria-hidden="false">
    <div class="login__wall" aria-hidden="true"></div>
    <div class="login__card">
      <div class="login__logo">
        <div class="login__glyph">⌁</div>
        <h1 class="login__name">HACKER<span class="login__sep">//</span>OS</h1>
      </div>

      <div class="login__user">
        <div class="login__avatar">u</div>
        <div class="login__username">user</div>
      </div>

      <button class="login__enter" id="login-enter" type="button">
        <span class="login__arrow">↵</span>
        <span class="login__label">press Enter to log in</span>
      </button>
    </div>
    <div class="login__footer">
      <span>Hacker OS · 2.5.7</span>
      <span class="login__safe">you are in a safe space</span>
    </div>
  </div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <div class="boot__logo">
        <div class="boot__glyph">⌁</div>
        <h1 class="boot__name">HACKER<span class="boot__sep">//</span>OS</h1>
        <p class="boot__tag">starting up</p>
      </div>
      <div id="boot-log" class="boot__log"></div>
      <div class="boot__bar">
        <div id="boot-progress" class="boot__progress"></div>
      </div>
    </div>
  </div>

  <main id="desktop" class="desktop">
    <div id="windows" class="windows" aria-live="polite"></div>
  </main>

  <header class="statusbar">
    <div class="statusbar__left">
      <span class="statusbar__logo">⌁</span>
      <span class="statusbar__word">HACKER<span class="statusbar__sep">//</span>OS</span>
    </div>
    <div class="statusbar__right">
      <span class="statusbar__stat" id="stat-net"><span class="dot dot--ok"></span>link</span>
      <span class="statusbar__stat" id="stat-cpu">cpu <b>--</b></span>
      <span class="statusbar__stat" id="stat-mem">mem <b>--</b></span>
      <span class="statusbar__clock" id="clock" title="">--:--:--</span>
    </div>
  </header>

  <div class="dock" id="dock" role="toolbar" aria-label="Dock"></div>

  <div class="launcher" id="launcher" aria-hidden="true">
    <div class="launcher__backdrop" data-close></div>
    <div class="launcher__panel">
      <div class="launcher__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-search"></use></svg>
        <input id="launcher-input" type="text" placeholder="Search applications…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="launcher__grid" id="launcher-grid"></div>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
